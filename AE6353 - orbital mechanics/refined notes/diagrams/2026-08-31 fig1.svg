<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="380" height="300">
  <rect x="0" y="0" width="380" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- position vector r-bar -->
  <line x1="45" y1="265" x2="238" y2="135" stroke="#000000" stroke-width="2.6" marker-end="url(#ah)"/>
  <text x="140" y="222" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="21">r&#x0304;</text>

  <!-- increment of r-bar at the tip -->
  <line x1="243" y1="132" x2="228" y2="40" stroke="#000000" stroke-width="2.6" marker-end="url(#ah)"/>
  <text x="252" y="90" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="21">r&#x0307;&#x0304;</text>

  <!-- dotted wedge showing the swept increment -->
  <line x1="240" y1="134" x2="170" y2="68" stroke="#000000" stroke-width="1.6" stroke-dasharray="3 5"/>
  <path d="M 170 68 Q 200 40 226 44" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="3 5"/>
</svg>
