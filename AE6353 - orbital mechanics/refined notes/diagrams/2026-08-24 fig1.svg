<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">
  <rect width="800" height="620" fill="white"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#cc0000"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <!-- coordinate origin triad -->
  <line x1="90" y1="540" x2="90" y2="450" stroke="black" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="90" y1="540" x2="190" y2="540" stroke="black" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="90" y1="540" x2="38" y2="592" stroke="black" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="68" y="462" font-size="30" font-style="italic">z</text>
  <text x="200" y="550" font-size="30" font-style="italic">y</text>
  <text x="18" y="612" font-size="30" font-style="italic">x</text>

  <!-- position vectors -->
  <line x1="90" y1="540" x2="421" y2="121" stroke="#cc0000" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="90" y1="540" x2="666" y2="364" stroke="#cc0000" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="439" y1="119" x2="670" y2="350" stroke="#cc0000" stroke-width="3" marker-end="url(#ar)"/>

  <!-- masses -->
  <circle cx="430" cy="110" r="9" fill="black"/>
  <circle cx="680" cy="360" r="9" fill="black"/>
  <text x="452" y="102" font-size="32" font-style="italic">m<tspan dy="9" font-size="23">1</tspan></text>
  <text x="702" y="378" font-size="32" font-style="italic">m<tspan dy="9" font-size="23">2</tspan></text>

  <!-- vector labels -->
  <text x="205" y="320" font-size="34" font-style="italic" fill="#cc0000">r&#772;<tspan dy="9" font-size="24">1</tspan></text>
  <text x="400" y="493" font-size="34" font-style="italic" fill="#cc0000">r&#772;<tspan dy="9" font-size="24">2</tspan></text>
  <text x="585" y="205" font-size="34" font-style="italic" fill="#cc0000">r&#772;<tspan dy="9" font-size="24">12</tspan></text>
</svg>
