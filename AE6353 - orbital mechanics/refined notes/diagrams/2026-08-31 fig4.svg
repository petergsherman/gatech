<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" width="580" height="400">
  <rect x="0" y="0" width="580" height="400" fill="#ffffff"/>

  <!-- right-circular double cone -->
  <ellipse cx="230" cy="60" rx="105" ry="30" fill="none" stroke="#000000" stroke-width="2.6"/>
  <ellipse cx="230" cy="340" rx="105" ry="30" fill="none" stroke="#000000" stroke-width="2.6"/>
  <line x1="125" y1="60" x2="335" y2="340" stroke="#000000" stroke-width="3.2"/>
  <line x1="335" y1="60" x2="125" y2="340" stroke="#000000" stroke-width="3.2"/>

  <!-- horizontal cutting plane : circle -->
  <path d="M 50 155 L 175 120 L 400 120 L 275 155 z" fill="none" stroke="#cc0000" stroke-width="2.2"/>
  <ellipse cx="228" cy="137" rx="48" ry="14" fill="none" stroke="#cc0000" stroke-width="2.6"/>
  <text x="412" y="146" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="26" fill="#cc0000">Circle</text>

  <!-- tilted cutting plane : ellipse -->
  <path d="M 30 335 L 160 278 L 430 248 L 300 305 z" fill="none" stroke="#1a73e8" stroke-width="2.2"/>
  <ellipse cx="232" cy="285" rx="66" ry="18" transform="rotate(-10 232 285)" fill="none" stroke="#1a73e8" stroke-width="2.6"/>
  <text x="440" y="276" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="26" fill="#1a73e8">ellipse</text>
</svg>
