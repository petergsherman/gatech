<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect x="0" y="0" width="300" height="200" fill="#ffffff"/>
  <defs>
    <marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0000"/>
    </marker>
  </defs>

  <!-- r-bar : steeper of the two -->
  <line x1="40" y1="150" x2="175" y2="45" stroke="#cc0000" stroke-width="2.4" marker-end="url(#ahr)"/>
  <text x="112" y="70" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="20" fill="#cc0000">r&#x0304;</text>

  <!-- B-bar : shallower -->
  <line x1="40" y1="150" x2="240" y2="118" stroke="#cc0000" stroke-width="2.4" marker-end="url(#ahr)"/>
  <text x="232" y="148" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="20" fill="#cc0000">B&#x0304;</text>

  <!-- included angle, endpoints seated on both shafts -->
  <path d="M 124 137 A 85 85 0 0 0 107 98" fill="none" stroke="#cc0000" stroke-width="2"/>
  <text x="96" y="132" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="19" fill="#cc0000">&#x03B8;</text>
</svg>
