<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="19" font-style="italic">
  <defs>
    <marker id="ab2" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="black"/></marker>
    <marker id="ac2" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a9c5a"/></marker>
  </defs>
  <rect width="480" height="340" fill="white"/>

  <circle cx="240" cy="170" r="90" fill="none" stroke="black" stroke-width="1.6"/>
  <circle cx="240" cy="245" r="3.5" fill="black"/>
  <text x="200" y="270" font-size="15">O</text>

  <!-- p,q axes at origin O -->
  <line x1="240" y1="245" x2="140" y2="245" stroke="black" stroke-width="1.2" marker-end="url(#ab2)"/>
  <text x="112" y="250" font-size="16">p&#770;</text>
  <line x1="240" y1="245" x2="240" y2="330" stroke="black" stroke-width="1.2" marker-end="url(#ab2)"/>
  <text x="248" y="332" font-size="16">q&#770;</text>

  <!-- c_h vector, O to C -->
  <line x1="240" y1="245" x2="240" y2="170" stroke="red" stroke-width="1.6" marker-end="url(#ab2)"/>
  <text x="248" y="212" fill="red" font-size="16">c&#772;<tspan dy="-6" font-size="70%">h</tspan></text>
  <circle cx="240" cy="170" r="3" fill="black"/>

  <!-- v vector O to V -->
  <line x1="240" y1="245" x2="300" y2="105" stroke="black" stroke-width="1.8" marker-end="url(#ab2)"/>
  <text x="308" y="100">v&#772;</text>

  <!-- s vector C to V -->
  <line x1="240" y1="170" x2="300" y2="105" stroke="#1a9c5a" stroke-width="1.6" marker-end="url(#ac2)"/>
  <text x="270" y="128" fill="#1a9c5a" font-size="16">s&#772;</text>

  <!-- angle theta at C -->
  <path d="M 240,140 A 30 30 0 0 1 266,152" fill="none" stroke="#1a73e8" stroke-width="1.1"/>
  <text x="258" y="140" fill="#1a73e8" font-size="16">&#952;</text>

  <!-- angle beta at O, between c_h (vertical) and v -->
  <path d="M 240,205 A 40 40 0 0 1 255.7,208.3" fill="none" stroke="red" stroke-width="1.1"/>
  <text x="248" y="228" fill="red" font-size="15">&#946;</text>

  <!-- angle gamma at V, between v and s -->
  <path d="M 290.2,127.9 A 25 25 0 0 1 283,123.4" fill="none" stroke="#1a9c5a" stroke-width="1.1"/>
  <text x="275" y="140" fill="#1a9c5a" font-size="15">&#947;</text>
</svg>
