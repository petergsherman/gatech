<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect x="0" y="0" width="600" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="ah6s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="ah6r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc0000"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="30" y1="150" x2="470" y2="150" stroke="#000000" stroke-width="2.4"/>
  <line x1="215" y1="58" x2="215" y2="242" stroke="#000000" stroke-width="2.4"/>

  <!-- the ellipse -->
  <ellipse cx="215" cy="150" rx="150" ry="72" fill="none" stroke="#000000" stroke-width="2.8"/>
  <text x="226" y="112" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="21">b</text>
  <text x="135" y="140" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="20">x</text>

  <!-- occupied focus -->
  <circle cx="325" cy="150" r="9" fill="#000000"/>

  <!-- radius and true anomaly -->
  <line x1="325" y1="150" x2="347" y2="112" stroke="#cc0000" stroke-width="2.6" marker-end="url(#ah6r)"/>
  <text x="322" y="120" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="19" fill="#cc0000">r</text>
  <text x="349" y="145" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="15">&#x03B8;</text>
  <line x1="350" y1="108" x2="398" y2="84" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="3 5"/>
  <line x1="352" y1="154" x2="424" y2="150" stroke="#000000" stroke-width="1.6" stroke-dasharray="3 5"/>
  <text x="432" y="146" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="19">p</text>

  <!-- minor-axis extent carried off to the side -->
  <line x1="455" y1="78" x2="512" y2="76" stroke="#000000" stroke-width="2"/>
  <line x1="455" y1="222" x2="512" y2="224" stroke="#000000" stroke-width="2"/>
  <path d="M 528 96 L 538 78 L 548 96" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M 528 206 L 538 224 L 548 206" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="556" y="158" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="21">2b</text>

  <!-- centre-to-focus distance -->
  <line x1="325" y1="198" x2="325" y2="228" stroke="#000000" stroke-width="1.8"/>
  <line x1="217" y1="214" x2="323" y2="214" stroke="#000000" stroke-width="1.8" marker-start="url(#ah6s)" marker-end="url(#ah6s)"/>
  <text x="262" y="238" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="20">c</text>

  <!-- major axis -->
  <line x1="65" y1="152" x2="65" y2="258" stroke="#000000" stroke-width="1.8"/>
  <line x1="368" y1="152" x2="368" y2="262" stroke="#000000" stroke-width="1.8"/>
  <line x1="67" y1="252" x2="366" y2="254" stroke="#000000" stroke-width="1.8" marker-start="url(#ah6)" marker-end="url(#ah6)"/>
  <text x="200" y="278" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-style="italic" font-size="21">2a</text>
</svg>
